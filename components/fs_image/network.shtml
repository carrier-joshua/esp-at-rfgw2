				<h2>Network Information</h2>
				<form method="get">
					<div class="row responsive-label">
						<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
							<b>Host Name:</b>
						</div>
						<div class="col-sm-12 col-md-8 fluid"><!--#hostnm--></div>
					</div>

					<br>
					<div class="row responsive-label">
						<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
							<b>MAC Address:</b>
						</div>
						<div class="col-sm-12 col-md-8 fluid"><!--#macaddr--></div>
					</div>

					<br>
					<div class="row responsive-label">
						<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
							<b>IP Address:</b>
						</div>
						<div class="col-sm-12 col-md-8 fluid"><!--#curip--></div>
					</div>
					<br>
					<div class="row responsive-label">
							<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
								<b>Subnet:</b>
							</div>
							<div class="col-sm-12 col-md-8 fluid"><!--#cursn--></div>
					</div>
					<br>
					<div class="row responsive-label">
							<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
								<b>Gateway:</b>
							</div>
							<div class="col-sm-12 col-md-8 fluid"><!--#curgw--></div>
					</div>
					<br>
					<div class="row responsive-label">
							<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
								<b>Primary DNS:</b>
							</div>
							<div class="col-sm-12 col-md-8 fluid"><!--#curpdns--></div>
					</div>
					<br>
					<div class="row responsive-label">
							<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
								<b>Secondary DNS:</b>
							</div>
							<div class="col-sm-12 col-md-8 fluid"><!--#cursdns--></div>
					</div>
				</form>
				
				<br><br>
			
				<h2>Ethernet Settings</h2>

				<form method="post" action="/save_network.xml">
					<fieldset>

						<div class="row responsive-label">	
									<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;">
										<input type="radio" name="dhcp" value="1" <!--#dhcpon-->>
									</div>

									<div class="col-sm-12 col-md-8 input-group" style="align-self: left; text-align: left;">
										<label for="dhcp" style="padding-left:0;">Determine network settings automatically with DHCP</label>
									</div> 
						</div>
						<br>
						<br>
						<div class="row responsive-label">
							<div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><input type="radio" name="dhcp" value="0" <!--#dhcpoff-->></div>
							<div class="col-sm-12 col-md-8 input-group" style="align-self: left; text-align: left;"><label for="dhcp" style="padding-left:0;">Use the following network settings:</label></div>
						</div>
						<br>
						<div class="row responsive-label"><div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><label for="ip">IP address:</label></div>
						<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;"><input id="ip" name="ip" type="text" value= "<!--#netip-->" ></div></div>	
						<div class="row responsive-label"><div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><label for="sn">Subnet:</label></div>
						<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;"><input type="text" id="sn" name="sn" value= "<!--#netsn-->" ></div></div>
						<div class="row responsive-label"><div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><label for="gw">Gateway:</label></div>
						<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;"><input type="text" id="gw" name="gw" value= "<!--#netgw-->" ></div></div>
						<div class="row responsive-label"><div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><label for="gw">Primary DNS:</label></div>
						<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;"><input type="text" id="dns1" name="dns1" value= "<!--#curpdns-->" ></div></div>
						<div class="row responsive-label"><div class="col-sm-12 col-md-4" style="align-self: center; text-align: left;"><label for="gw">Secondary DNS:</label></div>
						<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;"><input type="text" id="dns2" name="dns2" value= "<!--#cursdns-->" ></div></div>
						<br>
						<div class="row responsive-label"><div class="col-sm-12 col-md-4">
						</div>
						<div class="col-sm-12 col-md-8 input-group">
							<input class="button secondary" value="Save Ethernet Settings" type="submit" style="background-color: #8dc63f;">
						</div>
					</fieldset>
				</form>
