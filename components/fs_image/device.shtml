								<div class="col-sm-12 col-md-8 input-group fluid" style="align-self: center;">
									<input readonly type="text" value="<!--#devname-->">
								</div>

							</div>

							<p>This device is running firmware version <span id="version"></span>(<span

					refreshVariable(["battery"], 30040, "");

					refreshVariable(["chnames2"],30060,"");
